<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<title>og-image source</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Gloock&family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0f1012;
    color: #f4f2ec;
    padding: 80px 96px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: "Geist", system-ui, sans-serif;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: .06;
    mix-blend-mode: screen;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .kicker {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 18px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #7a7780;
  }
  .name {
    font-family: "Gloock", "Times New Roman", serif;
    font-size: 200px;
    line-height: 0.98;
    letter-spacing: -0.02em;
  }
  .name .last { font-style: italic; color: #8B3A5F; }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #c9c5bd;
  }
  .meta .right { color: #8B3A5F; }
  .rule {
    display: inline-block;
    width: 32px;
    height: 1px;
    background: #2a2b30;
    margin: 0 12px 6px 0;
    vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="kicker"><span class="rule"></span>Portfolio &amp; CV · 2026</div>
  <div>
    <div class="name">Simon</div>
    <div class="name"><span class="last">Beijer</span></div>
  </div>
  <div class="meta">
    <span>Fullstack Developer · Göteborg</span>
    <span class="right">simonbeijer.vercel.app ↗</span>
  </div>
</body>
</html>
